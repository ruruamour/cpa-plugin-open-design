name: Windows diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run focused Windows tests
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./internal/opendesign -run 'TestQuotaRecovery|TestQuotaRecheck' -count=1 -v
